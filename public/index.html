<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <meta name="theme-color" content="#000000" />

    <!-- Search (Google etc.) -->
    <meta
      name="description"
      content="OS常駐うさちゃんと同期するGallery。ついでに音楽も聴ける。— build 20XX v1.2"
    />

    <!-- OGP (LINE / SNS) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="os_usagi" />
    <meta property="og:description" content="OS常駐うさちゃん。だいたい充電中。かわいい。" />
    <meta property="og:image" content="%PUBLIC_URL%/ogp.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://osusagi.netlify.app/" />

    <!-- Twitter/X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="os_usagi" />
    <meta
      name="twitter:description"
      content="OS常駐うさちゃん。だいたい充電中。かわいい。"
    />
    <meta name="twitter:image" content="%PUBLIC_URL%/ogp.png" />

    <!--
      manifest.json provides metadata used when your web app is added to the
      homescreen on Android. See https://developers.google.com/web/fundamentals/engage-and-retain/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Icons -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="shortcut icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />

    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>os_usagi</title>
  </head>

  <script src="https://cdn.tailwindcss.com"></script>

  <body>
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <div id="root"></div>

  </body>
</html>
